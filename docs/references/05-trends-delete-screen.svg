<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" style="background:#F8FAFC;font-family:system-ui,-apple-system,sans-serif;">
  <!-- Status Bar -->
  <rect width="400" height="32" fill="#0F172A"/>
  <text x="20" y="21" fill="#FFFFFF" font-size="12" font-weight="600">10:46</text>
  <text x="340" y="21" fill="#FFFFFF" font-size="12">4G 78%</text>

  <!-- Header -->
  <rect y="32" width="400" height="60" fill="#0D9488"/>
  <text x="20" y="68" fill="#FFFFFF" font-size="18" font-weight="700">Past Trends &amp; Data Control</text>

  <!-- Past Trends Card -->
  <g transform="translate(16, 108)">
    <rect width="368" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="28" fill="#0F172A" font-size="15" font-weight="700">📈 Biomarker Trends Over Time</text>

    <!-- Trend Row 1 -->
    <g transform="translate(14, 46)">
      <rect width="340" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="22" fill="#0F172A" font-size="13" font-weight="600">Fasting Blood Glucose</text>
      <text x="12" y="40" fill="#64748B" font-size="11">Oct 12 → Nov 10</text>
      <rect x="236" y="14" width="90" height="26" rx="13" fill="#DCFCE7"/>
      <text x="281" y="31" fill="#15803D" font-size="11" font-weight="700" text-anchor="middle">↓ 210 → 175</text>
    </g>

    <!-- Trend Row 2 -->
    <g transform="translate(14, 108)">
      <rect width="340" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="22" fill="#0F172A" font-size="13" font-weight="600">HbA1c (3-Month Sugar)</text>
      <text x="12" y="40" fill="#64748B" font-size="11">July 04 → Nov 10</text>
      <rect x="236" y="14" width="90" height="26" rx="13" fill="#FEF3C7"/>
      <text x="281" y="31" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">↔ 8.2% → 8.0%</text>
    </g>

    <text x="16" y="195" fill="#64748B" font-size="12">Trends are calculated across scrubbed values only.</text>
  </g>

  <!-- DPDP Act Data Privacy & Erasure Card -->
  <g transform="translate(16, 356)">
    <rect width="368" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="28" fill="#0F172A" font-size="15" font-weight="700">🔒 DPDP Act 2023: Your Data Rights</text>
    <text x="16" y="52" fill="#475569" font-size="12">You have the legal right to erase all your medical summaries,</text>
    <text x="16" y="70" fill="#475569" font-size="12">past trends, and chat logs from our database at any time.</text>

    <!-- Delete Confirmation Box -->
    <g transform="translate(14, 96)">
      <rect width="340" height="120" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
      <text x="16" y="26" fill="#991B1B" font-size="13" font-weight="700">Permanent Erasure (ಮಾಹಿತಿ ಅಳಿಸಿ):</text>
      <text x="16" y="46" fill="#B91C1C" font-size="11">This will permanently delete all records linked to this device.</text>
      
      <rect x="16" y="62" width="308" height="44" rx="8" fill="#DC2626"/>
      <text x="170" y="89" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">🗑️ Permanently Delete All My Data</text>
    </g>
  </g>

  <!-- Bottom Navigation -->
  <rect y="740" width="400" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
</svg>
